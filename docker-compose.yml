version: "3.8"

services:
    # 1. Container do Banco de Dados PostgreSQL
    db:
        image: postgres:15-alpine
        container_name: postgres_db
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
            POSTGRES_DB: invoices
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d invoices"]
            interval: 5s
            timeout: 5s
            retries: 5

    # 2. Container do RabbitMQ com Painel Visual
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rabbitmq_broker
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "5672:5672" # Onde o Python e o Node conectam
            - "15672:15672" # Painel Visual no navegador
        volumes:
            - rabbit_data:/var/lib/rabbitmq

    # 3. O nosso Worker de Inteligência Artificial em Python
    worker:
        build: .
        container_name: python_worker
        environment:
            # Aponta para os containers internos do Docker
            - DATABASE_URL=postgresql://admin:admin123@db:5432/invoices
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
            # Repassa a sua chave de API para dentro do container
            - GEMINI_API_KEY='AQ.Ab8RN6LQ1Aco0xMykHtdAPSEcreRkeH1N-m4na5p-F6RzNm96Q'
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_started
        # A MÁGICA: Em vez de subir uma API, liga o trabalhador!
        command: python -m app.worker
        volumes:
            - .:/app # Permite alterar o código do worker sem precisar "rebuildar"

    # 4. Painel Visual de Monitoramento do Docker
    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer_dashboard
        restart: always
        ports:
            - "9000:9000"
        volumes:
            # Essa linha é a mágica: dá acesso ao Portainer para ler o status do seu Docker
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    pg_data:
    rabbit_data:
    portainer_data:
